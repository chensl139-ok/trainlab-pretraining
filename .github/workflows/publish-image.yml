name: Build and publish GPU image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/publish-image.yml'
      - 'server/**'
      - 'scripts/**'
      - 'dist/**'
      - 'examples/**'
      - 'tests/**'
      - 'Makefile'
permissions:
  contents: read
concurrency:
  group: ghcr-publish-main
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/chensl139-ok/trainlab-pretraining
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test API, permissions and frontend logic
        run: |
          python3 -m venv /tmp/trainlab-tests
          /tmp/trainlab-tests/bin/pip install -r server/requirements-api.txt pytest==9.0.3 httpx==0.28.1
          make check PYTHON=/tmp/trainlab-tests/bin/python
      - name: Make room for the CUDA runtime on the disposable runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build Linux amd64 image
        run: |
          docker build --platform linux/amd64 --build-arg TRAINLAB_REVISION="$GITHUB_SHA" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.description="Single-node GPU text pretraining workbench" \
            --tag "$IMAGE:sha-$GITHUB_SHA" .
      - name: Verify training and resume in the actual image (CPU only)
        run: |
          for architecture in gpt2 qwen3 qwen3_5; do
            extra=""
            if [ "$architecture" = qwen3 ]; then extra="--post-training"; fi
            docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,size=1g,mode=1777 \
            --tmpfs /state:rw,size=1g,uid=10001,gid=10001 \
            --tmpfs /app/.runtime:rw,size=1g,uid=10001,gid=10001 \
            -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 \
              "$IMAGE:sha-$GITHUB_SHA" python -m scripts.smoke_train --architecture "$architecture" $extra
          done
      - name: Verify production API with read-only filesystem
        run: |
          docker run -d --name trainlab-check --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,size=256m,mode=1777 \
            --tmpfs /state:rw,size=256m,uid=10001,gid=10001 \
            -e TRAINLAB_ENV=production -e TRAINLAB_AUTH_MODE=credentials -e TRAINLAB_MIN_FREE_BYTES=10485760 \
            -p 127.0.0.1:18000:8000 "$IMAGE:sha-$GITHUB_SHA"
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/api/ready; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then docker logs trainlab-check; exit 1; fi
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18000/api/system)" = 401
          curl --fail --silent http://127.0.0.1:18000/gpu.html > /dev/null
          docker exec trainlab-check python -m scripts.users issue --subject image-check --project ci --role admin --days 1 --credential-file /state/ci.key
          docker exec -i trainlab-check python - <<'PY_CHECK'
          import json, pathlib, urllib.request
          token=pathlib.Path('/state/ci.key').read_text().strip()
          def call(path,body=None):
              data=None if body is None else json.dumps(body).encode()
              request=urllib.request.Request('http://127.0.0.1:8000/api/'+path,data=data,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
              return json.load(urllib.request.urlopen(request,timeout=10))
          report=call('operations')
          assert report['service_version']==6 and report['database_integrity']=='ok'
          assert call('scheduler/control',{'paused':True,'reason':'CI image check'})['paused']
          assert call('system')['control']['paused']
          assert call('ready')['ready']
          assert not call('scheduler/control',{'paused':False})['paused']
          print('Authenticated operations and maintenance controls passed in the production image.')
          PY_CHECK
          docker rm -f trainlab-check
      - name: Verify credential-free personal mode in the actual image
        run: |
          docker run -d --name trainlab-local-check --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,size=256m,mode=1777 \
            --tmpfs /state:rw,size=256m,uid=10001,gid=10001 \
            -e TRAINLAB_ENV=production -e TRAINLAB_AUTH_MODE=local -e TRAINLAB_MIN_FREE_BYTES=10485760 \
            -p 127.0.0.1:18001:8000 "$IMAGE:sha-$GITHUB_SHA"
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18001/api/ready; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then docker logs trainlab-local-check; exit 1; fi
          curl --fail --silent http://127.0.0.1:18001/api/system > /tmp/trainlab-local-system.json
          python3 - <<'PY_LOCAL'
          import json
          report=json.load(open('/tmp/trainlab-local-system.json'))
          assert report['auth_mode']=='local' and report['identity']['subject']=='local-owner'
          PY_LOCAL
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Host: untrusted.example' http://127.0.0.1:18001/api/system)" = 403
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Origin: https://untrusted.example' http://127.0.0.1:18001/api/system)" = 403
          curl --fail --silent -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:18001' \
            -d '{"paused":true,"reason":"local mode image check"}' http://127.0.0.1:18001/api/scheduler/control > /tmp/trainlab-local-control.json
          python3 - <<'PY_LOCAL'
          import json
          assert json.load(open('/tmp/trainlab-local-control.json'))['paused']
          print('Credential-free personal access and host/origin guards passed in the production image.')
          PY_LOCAL
          docker rm -f trainlab-local-check
      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish tested image
        run: |
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          digest=$(docker image inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
          {
            echo '### Published GPU training image'
            echo "Image: \`$IMAGE:sha-$GITHUB_SHA\`"
            echo "Pinned digest: \`$digest\`"
            echo 'API and offline CPU training/resume verified; GPU/CUDA/NCCL acceptance requires target hardware.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up registry credentials and test container
        if: always()
        run: |
          docker rm -f trainlab-check trainlab-local-check 2>/dev/null || true
          docker logout ghcr.io
