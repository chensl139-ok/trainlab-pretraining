services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      TRAINLAB_DOMAIN: ${TRAINLAB_DOMAIN:?Set TRAINLAB_DOMAIN in .env first}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - trainlab
volumes:
  caddy-data:
  caddy-config:
